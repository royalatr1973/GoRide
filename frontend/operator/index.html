<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoRide Operator</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app-section">
    <!-- Header -->
    <div class="header">
      <h1>GoRide Operator</h1>
      <button onclick="handleLogout()" class="back-btn" title="Logout">&#x2716;</button>
    </div>

    <!-- Pages -->

    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page container">
      <div class="card mt-16">
        <h3 id="company-name">Dashboard</h3>
        <p class="text-sm text-gray" id="company-plan"></p>
      </div>

      <div class="stats-grid mt-16">
        <div class="stat-card">
          <span class="stat-value" id="stat-total-drivers">0</span>
          <span class="stat-label">Total Drivers</span>
        </div>
        <div class="stat-card accent-green">
          <span class="stat-value" id="stat-active-drivers">0</span>
          <span class="stat-label">Active Drivers</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-vehicles">0</span>
          <span class="stat-label">Total Vehicles</span>
        </div>
        <div class="stat-card accent-green">
          <span class="stat-value" id="stat-active-vehicles">0</span>
          <span class="stat-label">Active Vehicles</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-rides">0</span>
          <span class="stat-label">Total Rides</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-today-rides">0</span>
          <span class="stat-label">Rides Today</span>
        </div>
      </div>

      <div class="card mt-16">
        <div class="flex-between">
          <span class="text-gray">Today's Revenue</span>
          <strong id="stat-today-revenue" style="font-size:1.5rem; color:var(--primary)">&#x20B9;0</strong>
        </div>
      </div>
    </div>

    <!-- DRIVERS -->
    <div id="page-drivers" class="page container" style="display:none">
      <div class="flex-between mt-16">
        <h2>Drivers</h2>
        <button class="btn btn-primary btn-sm" style="width:auto" onclick="openAddDriverModal()">+ Add Driver</button>
      </div>
      <div id="drivers-list" class="mt-16"><div class="spinner"></div></div>
    </div>

    <!-- VEHICLES -->
    <div id="page-vehicles" class="page container" style="display:none">
      <div class="flex-between mt-16">
        <h2>Vehicles</h2>
        <button class="btn btn-primary btn-sm" style="width:auto" onclick="openAddVehicleModal()">+ Add Vehicle</button>
      </div>
      <div id="vehicles-list" class="mt-16"><div class="spinner"></div></div>
    </div>

    <!-- RIDES -->
    <div id="page-rides" class="page container" style="display:none">
      <h2 class="mt-16">Rides</h2>
      <div class="flex gap-8 mt-16">
        <select class="form-control" id="rides-status-filter" onchange="loadRides()">
          <option value="">All Status</option>
          <option value="requested">Requested</option>
          <option value="accepted">Accepted</option>
          <option value="started">Started</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div id="rides-list" class="mt-16"><div class="spinner"></div></div>
      <div id="rides-pagination" class="flex-center gap-8 mt-16"></div>
    </div>

    <!-- EARNINGS -->
    <div id="page-earnings" class="page container" style="display:none">
      <h2 class="mt-16">Earnings</h2>
      <div class="flex gap-8 mt-16">
        <button class="btn btn-outline btn-sm period-btn active" onclick="loadEarnings('today')">Today</button>
        <button class="btn btn-outline btn-sm period-btn" onclick="loadEarnings('week')">This Week</button>
        <button class="btn btn-outline btn-sm period-btn" onclick="loadEarnings('month')">This Month</button>
      </div>
      <div class="stats-grid mt-16" style="grid-template-columns: repeat(3, 1fr)">
        <div class="stat-card">
          <span class="stat-value" id="earn-revenue">&#x20B9;0</span>
          <span class="stat-label">Revenue</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="earn-rides">0</span>
          <span class="stat-label">Rides</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="earn-avg">&#x20B9;0</span>
          <span class="stat-label">Avg Fare</span>
        </div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="#" onclick="showPage('dashboard')" class="active" id="nav-dashboard">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Dashboard
      </a>
      <a href="#" onclick="showPage('drivers')" id="nav-drivers">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        Drivers
      </a>
      <a href="#" onclick="showPage('vehicles')" id="nav-vehicles">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
        Vehicles
      </a>
      <a href="#" onclick="showPage('rides')" id="nav-rides">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        Rides
      </a>
      <a href="#" onclick="showPage('earnings')" id="nav-earnings">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
        Earnings
      </a>
    </nav>
  </div>

  <!-- Add Driver Modal -->
  <div class="modal-overlay" id="add-driver-modal">
    <div class="modal">
      <div class="flex-between mb-16">
        <h2>Add Driver</h2>
        <button class="back-btn" onclick="closeModal('add-driver-modal')" style="color:var(--dark)">&#x2716;</button>
      </div>
      <form onsubmit="handleAddDriver(event)">
        <div class="flex gap-8">
          <div class="form-group" style="flex:1">
            <label>First Name</label>
            <input type="text" class="form-control" id="drv-firstname" required>
          </div>
          <div class="form-group" style="flex:1">
            <label>Last Name</label>
            <input type="text" class="form-control" id="drv-lastname" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="drv-email" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" class="form-control" id="drv-phone" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="drv-password" minlength="6" required>
        </div>
        <div class="form-group">
          <label>License Number</label>
          <input type="text" class="form-control" id="drv-license" required>
        </div>
        <div class="form-group">
          <label>License Expiry</label>
          <input type="date" class="form-control" id="drv-license-expiry" required>
        </div>
        <button type="submit" class="btn btn-primary" id="add-driver-btn">Add Driver</button>
      </form>
    </div>
  </div>

  <!-- Add Vehicle Modal -->
  <div class="modal-overlay" id="add-vehicle-modal">
    <div class="modal">
      <div class="flex-between mb-16">
        <h2>Add Vehicle</h2>
        <button class="back-btn" onclick="closeModal('add-vehicle-modal')" style="color:var(--dark)">&#x2716;</button>
      </div>
      <form onsubmit="handleAddVehicle(event)">
        <div class="form-group">
          <label>Registration Number</label>
          <input type="text" class="form-control" id="veh-reg" placeholder="e.g. MH01AB1234" required>
        </div>
        <div class="flex gap-8">
          <div class="form-group" style="flex:1">
            <label>Make</label>
            <input type="text" class="form-control" id="veh-make" placeholder="e.g. Maruti" required>
          </div>
          <div class="form-group" style="flex:1">
            <label>Model</label>
            <input type="text" class="form-control" id="veh-model" placeholder="e.g. Swift" required>
          </div>
        </div>
        <div class="flex gap-8">
          <div class="form-group" style="flex:1">
            <label>Year</label>
            <input type="number" class="form-control" id="veh-year" min="2000" max="2030" required>
          </div>
          <div class="form-group" style="flex:1">
            <label>Color</label>
            <input type="text" class="form-control" id="veh-color" required>
          </div>
        </div>
        <div class="flex gap-8">
          <div class="form-group" style="flex:1">
            <label>Type</label>
            <select class="form-control" id="veh-type" required>
              <option value="sedan">Sedan</option>
              <option value="suv">SUV</option>
              <option value="hatchback">Hatchback</option>
              <option value="auto">Auto</option>
            </select>
          </div>
          <div class="form-group" style="flex:1">
            <label>Capacity</label>
            <input type="number" class="form-control" id="veh-capacity" min="1" max="8" value="4" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="add-vehicle-btn">Add Vehicle</button>
      </form>
    </div>
  </div>

  <!-- Assign Driver Modal -->
  <div class="modal-overlay" id="assign-driver-modal">
    <div class="modal">
      <div class="flex-between mb-16">
        <h2>Assign Driver</h2>
        <button class="back-btn" onclick="closeModal('assign-driver-modal')" style="color:var(--dark)">&#x2716;</button>
      </div>
      <div class="form-group">
        <label>Select Driver</label>
        <select class="form-control" id="assign-driver-select"></select>
      </div>
      <button class="btn btn-primary" onclick="handleAssignDriver()">Assign</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
